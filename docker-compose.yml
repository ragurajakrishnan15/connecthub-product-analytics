# Credentials come from .env (copy .env.example). Nothing secret is hard-coded here.
#
#   docker compose up -d postgres                 warehouse only (local dev)
#   docker compose up -d                          + Airflow (builds docker/airflow)
#   docker compose --profile spark run --rm spark pytest tests/test_spark_jobs.py

x-pipeline-env: &pipeline-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-connecthub}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-connecthub_analytics}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: connecthub-airflow:local
  environment:
    <<: *pipeline-env
    AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow metadata lives in its own database, not in the analytics warehouse.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-connecthub}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?Set AIRFLOW__WEBSERVER__SECRET_KEY in .env}
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
  volumes:
    # Generated parquet is shared with the host; code is baked into the image.
    - ./data:/opt/connecthub/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connecthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-connecthub_analytics}
    ports:
      # Bound to localhost only; not reachable from other machines.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *pipeline-env
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-connecthub}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      # The image's entrypoint waits for the metadata DB before running the
      # command; this service is what creates that DB, so skip the wait.
      CONNECTION_CHECK_MAX_COUNT: "0"
    command: ["bash", "/opt/connecthub/docker/airflow/init.sh"]
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  spark:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: connecthub-spark:local
    environment:
      <<: *pipeline-env
    volumes:
      - ./data:/opt/connecthub/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
