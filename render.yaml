services:
  - type: web
    name: connecthub-analytics
    runtime: python
    region: oregon 
    buildCommand: "pip install -r requirements.txt -c requirements/constraints-py311.txt"
    startCommand: "API_PORT=$PORT python -m api"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_DASHBOARD_PATH
        value: index.html
      - key: API_ENV
        value: production
      - key: API_AUTH_MODE
        value: api_key
      # Supabase connection setup (sync: false ensures they are prompted on setup)
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: API_DB_USER
        sync: false
      - key: API_DB_PASSWORD
        sync: false
      - key: API_KEYS
        sync: false
