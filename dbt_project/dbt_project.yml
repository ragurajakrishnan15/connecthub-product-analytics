name: 'connecthub_analytics'
version: '1.0.0'
config-version: 2

profile: 'connecthub'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  # Incremental models recompute rows dated within this many days of the
  # latest date they already hold (see macros/incremental_window.sql).
  lookback_days: 3

clean-targets:
  - "target"
  - "dbt_packages"

models:
  connecthub_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    gold:
      +materialized: table
      +schema: gold
      # Small additive tables the API reads (Phase 4); built in the gold schema.
      serving:
        +tags: ['serving']
    semantic:
      +materialized: table
      +schema: semantic
