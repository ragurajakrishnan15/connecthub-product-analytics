[project]
name = "connecthub-product-analytics"
version = "0.1.0"
description = "Product analytics pipeline for ConnectHub: synthetic data, PostgreSQL warehouse, dbt, experimentation."
# dbt-core 1.7 and Airflow 2.8 do not support Python 3.12+.
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
# Make `analytics`, `experimentation` and `scripts` importable when running
# plain `pytest` from the project root.
pythonpath = [".", "scripts"]
testpaths = ["tests"]
markers = [
    "integration: needs a reachable PostgreSQL (set POSTGRES_* in the environment)",
]
filterwarnings = [
    # Third-party deprecation noise (matplotlib/pyparsing, great_expectations).
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:great_expectations.*",
    # Starlette 1.x recommends httpx2 for its TestClient; httpx (pinned) still works.
    # (StarletteDeprecationWarning subclasses UserWarning.)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["dbt_project/target", "dbt_project/dbt_packages", "data"]

[tool.ruff.lint]
select = ["F", "E9"]
