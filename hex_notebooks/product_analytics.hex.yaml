# Hex Notebook Configuration
# Import this into Hex (hex.tech) and connect to your warehouse
name: ConnectHub Product Analytics
description: Interactive product analytics notebook — DAU, activation funnel, retention cohorts, feature adoption, experiments
connection: connecthub_warehouse

cells:
  - id: cell_1
    type: sql
    name: "DAU Trend"
    query: |
      SELECT event_date, dau, wau_7d, mau_28d
      FROM gold.fct_daily_active_users
      WHERE event_date BETWEEN '{{start_date}}' AND '{{end_date}}'
      ORDER BY event_date

  - id: cell_2
    type: python
    name: "Visualize DAU"
    code: |
      import plotly.express as px
      fig_dau = px.line(cell_1, x='event_date', y='dau', title='Daily Active Users')
      fig_dau.update_layout(xaxis_title='', yaxis_title='Users')
      fig_dau

  - id: cell_3
    type: sql
    name: "Activation Funnel"
    query: |
      SELECT
          COUNT(*) AS signed_up,
          SUM(placed_first_call) AS placed_first_call,
          SUM(used_ai_feature) AS used_ai_feature,
          SUM(invited_team_member) AS invited_team_member
      FROM intermediate.int_activation_funnel
      WHERE signup_date BETWEEN '{{start_date}}' AND '{{end_date}}'

  - id: cell_4
    type: python
    name: "Funnel Visualization"
    code: |
      import plotly.graph_objects as go
      stages = ['Signed Up', 'Placed First Call', 'Used AI Feature', 'Invited Team']
      values = cell_3.iloc[0].tolist()
      fig = go.Figure(go.Funnel(y=stages, x=values, textinfo='value+percent initial'))
      fig.update_layout(title='14-Day Activation Funnel')
      fig

  - id: cell_5
    type: sql
    name: "Retention Matrix"
    query: |
      SELECT cohort_week, weeks_since_signup, retention_rate
      FROM gold.fct_retention_cohorts
      WHERE weeks_since_signup <= 12
      ORDER BY cohort_week, weeks_since_signup

  - id: cell_6
    type: python
    name: "Retention Heatmap"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      matrix = cell_5.pivot(index='cohort_week', columns='weeks_since_signup', values='retention_rate')
      fig, ax = plt.subplots(figsize=(16, 10))
      sns.heatmap(matrix, annot=True, fmt='.1f', cmap='Blues', ax=ax)
      ax.set_title('Weekly Retention Cohort Matrix')
      fig

  - id: cell_7
    type: markdown
    name: "Key Insight"
    content: |
      **Key Insight:** DAU grew 12.3% month-over-month, driven primarily
      by AI Assist adoption among Professional-tier workspaces.
      Week-2 retention improved from 41% to 46% after the guided
      setup flow launched.

      **Recommendation:** Surface AI Assist as a post-call CTA
      within the first week to close the activation funnel gap.

  - id: cell_8
    type: python
    name: "Experiment Evaluation"
    code: |
      from experimentation.evaluate import evaluate_experiment
      results = evaluate_experiment(conn, 'exp_onboarding_v2')
      results

parameters:
  - name: start_date
    type: date
    default: "2025-01-01"
  - name: end_date
    type: date
    default: "2025-12-31"
